<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>factura</title>
    <script src="factura.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container bg bg-warning">
        <h2>Factura Lico 5to A</h2>
        <section>
            <div class="bg-secondary">

                <!-- Informacion del cliente -->
                 <h4>Información Cliente</h4>
                <label>Cliente</label>
                <input type="text" id="nombreCliente">

                <label for="">Cedula</label>
                <input type="text" id="cedulaCliente">

                <label for="">Sexo</label>
                <input type="text" id="sexoCliente">

            </div>
        </section>
        <section>
            <!-- Informacion de los productos -->
             <div class="bg-success">
                <h4>Agregar Productos</h4>
                <label> Producto</label>
                <input type="text" id="producto">

                <label for="">Cantidad</label>
                <input type="number" id="cantidad">

                <label for="">Precio</label>
                <input type="number" id="precio">

                <button id="btnAgregarProducto"> Agregar Producto</button>

             </div>

             <div class="bg-danger">
                <!-- Tabla de informacion factura -->
                <h5>Lista De Productos</h5>
                <table border="3" table table-hover>
                    <thead>
                        <tr><!-- fila-->
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="detalleFactura">

                    </tbody>
                    
                </table>
             </div>

        </section>

        <section>
            <!-- Informacion de los totales -->
            <div class="bg-secondary container-xs d-flex justify-content-end">
                <h4>Resumen de la factura</h4>
                <div><br>
                    <section>
                        <h6></h6>
                        <label id="subtotalFinal">Subtotal</label> <br>
                        <label id="impuesto">IVA</label> <br>
                        <label id="totalFinal">Total</label> <br>
                    </section>    
                </div>
            </div>
        </section>
    </div>
</body>
</html>
